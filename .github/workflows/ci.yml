name: CI

on:
  push:
    branches: [main]
  pull_request:

# One queue entry per ref (or per PR number, so successive pushes to the same PR don't queue
# behind each other) - mirrors the other studylife-* repos' pipelines.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

# Least-privilege default for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# jobs that need more declare it themselves.
permissions:
  contents: read
  # The reusable release workflow resolves its own commit through the Actions API.
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:22
            github.com:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache without paying the cost of a
      # clean cache on every normal run - only retries with a forced clean if the first
      # `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm run typecheck
      - run: npm audit --audit-level=high

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:22
            github.com:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm test
      # No .vsix-equivalent artifact here: `ray build` just validates the extension is Store-
      # ready (types, manifest, bundling) and exits. `ray publish` is inherently interactive
      # (it needs the maintainer's own Raycast account) and must never run in CI, so there is
      # nothing to upload afterwards - unlike studylife-vscode's ci.yml, this job produces no
      # artifact.
      - run: npx ray build

  # ---------------------------------------------------------------------
  # Version / release - push to main only (mirrors studylife-capture's ci.yml pattern).
  # ---------------------------------------------------------------------
  get-version:
    needs: [build]
    if: github.event_name == 'push'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@d2e0693df66fa10167181e6c3844cdc2032f4399 # v0.7.2
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@d2e0693df66fa10167181e6c3844cdc2032f4399 # v0.7.2
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  # No publish job: the old chain built and uploaded nothing after the version bump (`ray build` only
  # validates the extension and `ray publish` is interactive), so there is nothing to attach to the release.
